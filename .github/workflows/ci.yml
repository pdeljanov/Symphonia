name: CI

on:
  push:
    branches:
      - master
      - main
      - "rel-*"
      - "dev-*"
  pull_request: {}

jobs:
  check:
    name: Check ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - name: Check default features
        run: cargo check --all

      - name: Check all features
        run: cargo check --all --all-features --exclude symphonia-play

      - name: Check fuzzers
        run: cargo check --manifest-path symphonia/fuzz/Cargo.toml --verbose

  no-std:
    name: no_std

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        run: rustup install stable --profile minimal && rustup target add thumbv7m-none-eabi

      - name: Check no_std for symphonia
        run: cargo check -p symphonia --target thumbv7m-none-eabi --no-default-features --features all,no_std

      - name: Check no_std for individual crates
        run: |
          set -euo pipefail

          target=thumbv7m-none-eabi

          while read -r package features; do
            cargo check -p "$package" --target "$target" --no-default-features \
              --features "no_std${features:+,$features}"
          done <<'EOF'
          symphonia-core
          symphonia-common
          symphonia-metadata ape,id3v1,id3v2,flac,riff,vorbis
          symphonia-bundle-flac
          symphonia-bundle-mp3 mp1,mp2,mp3
          symphonia-codec-aac
          symphonia-codec-adpcm
          symphonia-codec-alac
          symphonia-codec-opus
          symphonia-codec-pcm
          symphonia-codec-vorbis
          symphonia-codec-wavpack
          symphonia-format-caf
          symphonia-format-isomp4
          symphonia-format-mkv
          symphonia-format-ogg
          symphonia-format-riff aiff,wav
          EOF

  clippy:
    name: Clippy ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable && rustup component add clippy

      - name: Check default features
        run: cargo clippy --all -- -D warnings

      - name: Check all features
        run: cargo clippy --all --all-features --exclude symphonia-play -- -D warnings

  test:
    name: Test ${{ matrix.config.target }} on ${{ matrix.config.os }}

    env:
      CARGO: cargo
      CROSS_VERSION: v0.2.5

    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              use-cross: false,
            }
          - { os: macos-latest, target: aarch64-apple-darwin, use-cross: false }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              use-cross: false,
            }
          - {
              os: ubuntu-latest,
              target: powerpc-unknown-linux-gnu,
              use-cross: true,
            }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - name: Setup Cross
        if: matrix.config.use-cross
        run: |
          cargo install cross --locked
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Test default features
        run: ${{ env.CARGO }} test --target ${{ matrix.config.target }} --all --exclude symphonia-play

      - name: Test all features
        run: ${{ env.CARGO }} test --target ${{ matrix.config.target }} --all --all-features --exclude symphonia-play

  fmt:
    name: Rustfmt

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        run: rustup install nightly --profile minimal && rustup default nightly && rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
