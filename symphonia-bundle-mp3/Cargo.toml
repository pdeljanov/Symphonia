[package]
name = "symphonia-bundle-mp3"
description = "Pure Rust MP1, MP2, and MP3 demuxer and decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "mp3", "mpeg"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["mp1", "mp2", "mp3", "std"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
std = ["symphonia-core/std", "num-traits/std"]

# Enable no_std support with `default-features = false`.
no_std = ["symphonia-core/no_std", "num-traits/libm"]

mp1 = []
mp2 = []
mp3 = []

[dependencies]
log = { workspace = true }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }
num-traits = { version = "0.2.19", default-features = false }
symphonia-core = { version = "0.6.1", path = "../symphonia-core", default-features = false }

[lints]
workspace = true
