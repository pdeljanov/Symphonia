[package]
name = "symphonia-codec-speex"
description = "Pure Rust Speex decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "speex"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
log = { workspace = true }
symphonia-core = { version = "0.6.1", path = "../symphonia-core" }

[lints]
workspace = true

[dev-dependencies]
symphonia-format-ogg = { version = "0.6.1", path = "../symphonia-format-ogg" }
