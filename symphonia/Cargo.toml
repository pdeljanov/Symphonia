[package]
name = "symphonia"
description = "Pure Rust media container and audio decoding library."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding", "multimedia::video"]
keywords = ["audio", "codec", "decoder", "multimedia", "media"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Show documentation with all features enabled on docs.rs
[package.metadata.docs.rs]
all-features = true

[features]
# Only royalty-free open standard codecs and formats are enabled by default.
default = ["opt-simd", "all-meta", "adpcm", "flac", "mkv", "ogg", "opus", "pcm", "vorbis", "wav", "wavpack"]

# Feature flags to enable specific codecs, container, and standalone metadata formats.
aac = ["dep:symphonia-codec-aac"]
mac = ["dep:symphonia-bundle-ape"]
tta = ["dep:symphonia-bundle-tta"]
adx = ["dep:symphonia-bundle-adx"]
truehd = ["dep:symphonia-bundle-truehd"]
dfpwm = ["dep:symphonia-bundle-dfpwm"]
sbc = ["dep:symphonia-bundle-sbc"]
adpcm = ["dep:symphonia-codec-adpcm"]
alac = ["dep:symphonia-codec-alac"]
ac3 = ["dep:symphonia-codec-ac3"]
dca = ["dep:symphonia-codec-dca"]
speex = ["dep:symphonia-codec-speex"]
g723 = ["dep:symphonia-codec-g723"]
nellymoser = ["dep:symphonia-codec-nellymoser"]
flac = ["dep:symphonia-bundle-flac"]
wavpack = ["dep:symphonia-codec-wavpack"]
caf = ["dep:symphonia-format-caf"]
isomp4 = ["dep:symphonia-format-isomp4"]
flv = ["dep:symphonia-format-flv"]
ts = ["dep:symphonia-format-ts"]
mkv = ["dep:symphonia-format-mkv"]
mp1 = ["dep:symphonia-bundle-mp3", "symphonia-bundle-mp3/mp1"]
mp2 = ["dep:symphonia-bundle-mp3", "symphonia-bundle-mp3/mp2"]
mp3 = ["dep:symphonia-bundle-mp3", "symphonia-bundle-mp3/mp3"]
ogg = ["dep:symphonia-format-ogg"]
opus = ["dep:symphonia-codec-opus"]
pcm = ["dep:symphonia-codec-pcm"]
aiff = ["dep:symphonia-format-riff", "symphonia-format-riff/aiff"]
vorbis = ["dep:symphonia-codec-vorbis"]
wav = ["dep:symphonia-format-riff", "symphonia-format-riff/wav"]
ape = ["symphonia-metadata/ape"]
id3v1 = ["symphonia-metadata/id3v1"]
id3v2 = ["symphonia-metadata/id3v2"]

# MPEG audio codecs.
mpa = ["mp1", "mp2", "mp3"]

# Enable all supported codecs.
all-codecs = [
    "aac",
    "mac",
    "tta",
    "adx",
    "truehd",
    "dfpwm",
    "sbc",
    "adpcm",
    "alac",
    "ac3",
    "dca",
    "speex",
    "g723",
    "nellymoser",
    "flac",
    "wavpack",
    "mp1",
    "mp2",
    "mp3",
    "opus",
    "pcm",
    "vorbis",
]

# Enable all supported container formats.
all-formats = [
    "mac",
    "tta",
    "adx",
    "truehd",
    "dfpwm",
    "sbc",
    "ac3",
    "dca",
    "caf",
    "flv",
    "ts",
    "isomp4",
    "mkv",
    "ogg",
    "wavpack",
    "aiff",
    "wav",
]

# Enable all supported standalone metadata formats.
all-meta = [
    "ape",
    "id3v1",
    "id3v2",
]

# Enable all supported codecs and formats.
all = [
    "all-codecs",
    "all-formats",
    "all-meta",
]

# SIMD support.
opt-simd-sse = ["symphonia-core/opt-simd-sse"]
opt-simd-avx = ["symphonia-core/opt-simd-avx"]
opt-simd-neon = ["symphonia-core/opt-simd-neon"]

# Enable all SIMD support.
opt-simd = [
    "opt-simd-sse",
    "opt-simd-avx",
    "opt-simd-neon",
]

# Experimental features.
exp-subtitle-codecs = ["symphonia-core/exp-subtitle-codecs"]
exp-video-codecs = ["symphonia-core/exp-video-codecs"]

[dependencies]
lazy_static = { workspace = true }

[dependencies.symphonia-core]
version = "0.6.1"
path = "../symphonia-core"

[dependencies.symphonia-metadata]
version = "0.6.1"
path = "../symphonia-metadata"
# Standalone crate enables all metadata formats by default.
default-features = false

[dependencies.symphonia-bundle-ape]
version = "0.6.1"
path = "../symphonia-bundle-ape"
optional = true

[dependencies.symphonia-bundle-tta]
version = "0.6.1"
path = "../symphonia-bundle-tta"
optional = true

[dependencies.symphonia-bundle-flac]
version = "0.6.1"
path = "../symphonia-bundle-flac"
optional = true

[dependencies.symphonia-bundle-mp3]
version = "0.6.1"
path = "../symphonia-bundle-mp3"
optional = true
# Standalone crate enables all MP1, MP2, and MP3 decoders by default.
default-features = false

[dependencies.symphonia-codec-aac]
version = "0.6.1"
path = "../symphonia-codec-aac"
optional = true

[dependencies.symphonia-codec-adpcm]
version = "0.6.1"
path = "../symphonia-codec-adpcm"
optional = true

[dependencies.symphonia-codec-alac]
version = "0.6.1"
path = "../symphonia-codec-alac"
optional = true

[dependencies.symphonia-codec-opus]
version = "0.6.1"
path = "../symphonia-codec-opus"
optional = true

[dependencies.symphonia-codec-g723]
version = "0.6.1"
path = "../symphonia-codec-g723"
optional = true

[dependencies.symphonia-codec-nellymoser]
version = "0.6.1"
path = "../symphonia-codec-nellymoser"
optional = true

[dependencies.symphonia-codec-speex]
version = "0.6.1"
path = "../symphonia-codec-speex"
optional = true

[dependencies.symphonia-bundle-dfpwm]
version = "0.6.1"
path = "../symphonia-bundle-dfpwm"
optional = true

[dependencies.symphonia-bundle-sbc]
version = "0.6.1"
path = "../symphonia-bundle-sbc"
optional = true

[dependencies.symphonia-bundle-truehd]
version = "0.6.1"
path = "../symphonia-bundle-truehd"
optional = true

[dependencies.symphonia-bundle-adx]
version = "0.6.1"
path = "../symphonia-bundle-adx"
optional = true

[dependencies.symphonia-format-flv]
version = "0.6.1"
path = "../symphonia-format-flv"
optional = true

[dependencies.symphonia-format-ts]
version = "0.6.1"
path = "../symphonia-format-ts"
optional = true

[dependencies.symphonia-codec-ac3]
version = "0.6.1"
path = "../symphonia-codec-ac3"
optional = true

[dependencies.symphonia-codec-dca]
version = "0.6.1"
path = "../symphonia-codec-dca"
optional = true

[dependencies.symphonia-codec-pcm]
version = "0.6.1"
path = "../symphonia-codec-pcm"
optional = true

[dependencies.symphonia-codec-vorbis]
version = "0.6.1"
path = "../symphonia-codec-vorbis"
optional = true

[dependencies.symphonia-codec-wavpack]
version = "0.6.0"
path = "../symphonia-codec-wavpack"
optional = true

[dependencies.symphonia-format-riff]
version = "0.6.1"
path = "../symphonia-format-riff"
optional = true
# Standalone crate enables AIFF and WAVE by default.
default-features = false

[dependencies.symphonia-format-ogg]
version = "0.6.1"
path = "../symphonia-format-ogg"
optional = true

[dependencies.symphonia-format-isomp4]
version = "0.6.1"
path = "../symphonia-format-isomp4"
optional = true

[dependencies.symphonia-format-mkv]
version = "0.6.1"
path = "../symphonia-format-mkv"
optional = true

[dependencies.symphonia-format-caf]
version = "0.6.1"
path = "../symphonia-format-caf"
optional = true

[lints]
workspace = true
