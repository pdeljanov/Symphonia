[package]
name = "symphonia-bundle-ape"
description = "Monkey's Audio (APE) decoder and demuxer (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "ape", "monkeys-audio"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ape-decoder = "0.3.2"
log = { workspace = true }
symphonia-core = { version = "0.6.1", path = "../symphonia-core" }

[lints]
workspace = true
