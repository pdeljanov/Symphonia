name: CI

on:
  push:
    branches:
      - master
      - main
      - "rel-*"
      - "dev-*"
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check (default features)
        run: cargo check --workspace

      - name: Check (all features)
        run: cargo check --workspace --all-features --exclude symphonia-play

      - name: Check fuzzers
        run: cargo check --manifest-path symphonia/fuzz/Cargo.toml --verbose

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Clippy (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Check Clippy (all features)
        run: cargo clippy --workspace --all-features --exclude symphonia-play -- -D warnings

  test:
    name: Test (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Linux x86_64",
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              use-cross: false,
            }
          - {
              name: "macOS aarch64",
              os: macos-latest,
              target: aarch64-apple-darwin,
              use-cross: false,
            }
          - {
              name: "Windows x86_64",
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              use-cross: false,
            }
          - {
              name: "PowerPC Big-Endian",
              os: ubuntu-latest,
              target: powerpc-unknown-linux-gnu,
              use-cross: true,
            }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.target }}

      - name: Install cross
        if: matrix.config.use-cross
        uses: taiki-e/install-action@cross

      - name: Test (default features)
        run: |
          CARGO="${{ matrix.config.use-cross && 'cross' || 'cargo' }}"
          $CARGO test --target ${{ matrix.config.target }} --workspace --exclude symphonia-play

      - name: Test (all features)
        run: |
          CARGO="${{ matrix.config.use-cross && 'cross' || 'cargo' }}"
          $CARGO test --target ${{ matrix.config.target }} --workspace --all-features --exclude symphonia-play

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Code Coverage
        run: cargo llvm-cov --workspace --all-features --exclude symphonia-play --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: lcov.info

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features --exclude symphonia-play

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace --all-features --exclude symphonia-play
