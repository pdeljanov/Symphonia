[package]
name = "symphonia-fuzz"
publish = false
# Common package metadata located in workspace Cargo.toml.
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/pdeljanov/Symphonia"
rust-version = "1.85"
version = "0.6.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.symphonia]
path = ".."
default-features = false
features = ["all"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "decode_any"
path = "fuzz_targets/decode_any.rs"
test = false
doc = false

