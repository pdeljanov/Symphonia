name: CI

on:
  push:
    branches:
      - master
      - main
      - "rel-*"
      - "dev-*"
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check (default features)
        run: cargo check --workspace

      - name: Check (all features)
        run: cargo check --workspace --all-features --exclude symphonia-play

      - name: Check fuzzers
        run: cargo check --manifest-path symphonia/fuzz/Cargo.toml --verbose

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Clippy (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Check Clippy (all features)
        run: cargo clippy --workspace --all-features --exclude symphonia-play -- -D warnings

  test:
    name: Test (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Linux x86_64",
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              use-cross: false,
            }
          - {
              name: "macOS aarch64",
              os: macos-latest,
              target: aarch64-apple-darwin,
              use-cross: false,
            }
          - {
              name: "Windows x86_64",
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              use-cross: false,
            }
          - {
              name: "PowerPC Big-Endian",
              os: ubuntu-latest,
              target: powerpc-unknown-linux-gnu,
              use-cross: true,
            }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.target }}

      - name: Install cross
        if: matrix.config.use-cross
        uses: taiki-e/install-action@cross

      - name: Test (default features)
        run: ${{ matrix.config.use-cross && 'cross' || 'cargo' }} test --target ${{ matrix.config.target }} --workspace --exclude symphonia-play

      - name: Test (all features)
        run: ${{ matrix.config.use-cross && 'cross' || 'cargo' }} test --target ${{ matrix.config.target }} --workspace --all-features --exclude symphonia-play

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure Base Branch Coverage
        if: github.event_name == 'pull_request'
        run: |
          git checkout ${{ github.base_ref }}
          cargo llvm-cov --no-report --workspace --all-features --exclude symphonia-play
          cargo llvm-cov report --json --output-path base-cov.json
          git checkout -

      - name: Measure PR Coverage
        run: |
          cargo llvm-cov --no-report --workspace --all-features --exclude symphonia-play
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --json --output-path pr-cov.json
          cargo llvm-cov report --summary-only > coverage-summary.txt

      - name: Generate Summary & Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let prTotals = null;
            if (fs.existsSync('pr-cov.json')) {
              const prData = JSON.parse(fs.readFileSync('pr-cov.json', 'utf8'));
              prTotals = prData.data?.[0]?.totals;
            }

            let baseTotals = null;
            if (fs.existsSync('base-cov.json')) {
              const baseData = JSON.parse(fs.readFileSync('base-cov.json', 'utf8'));
              baseTotals = baseData.data?.[0]?.totals;
            }

            const summaryText = fs.existsSync('coverage-summary.txt')
              ? fs.readFileSync('coverage-summary.txt', 'utf8')
              : '';

            function formatDelta(base, current) {
              if (base === undefined || base === null) return 'N/A';
              const diff = current - base;
              const sign = diff > 0 ? '+' : '';
              const icon = diff > 0 ? '🟢' : (diff < 0 ? '🔴' : '⚪');
              return `${sign}${diff.toFixed(2)}% ${icon}`;
            }

            let markdown = `## 📊 Code Coverage Report\n\n`;

            if (prTotals) {
              markdown += `| Metric | Base (\`${context.payload.pull_request?.base?.ref || 'base'}\`) | Current PR | Delta |\n`;
              markdown += `| :--- | :--- | :--- | :--- |\n`;

              const baseLinePct = baseTotals?.lines?.percent;
              const prLinePct = prTotals.lines?.percent ?? 0;
              markdown += `| **Line Coverage** | ${baseLinePct !== undefined ? baseLinePct.toFixed(2) + '%' : 'N/A'} | **${prLinePct.toFixed(2)}%** | ${formatDelta(baseLinePct, prLinePct)} |\n`;

              const baseFnPct = baseTotals?.functions?.percent;
              const prFnPct = prTotals.functions?.percent ?? 0;
              markdown += `| **Function Coverage** | ${baseFnPct !== undefined ? baseFnPct.toFixed(2) + '%' : 'N/A'} | **${prFnPct.toFixed(2)}%** | ${formatDelta(baseFnPct, prFnPct)} |\n`;

              const baseRegPct = baseTotals?.regions?.percent;
              const prRegPct = prTotals.regions?.percent ?? 0;
              markdown += `| **Region Coverage** | ${baseRegPct !== undefined ? baseRegPct.toFixed(2) + '%' : 'N/A'} | **${prRegPct.toFixed(2)}%** | ${formatDelta(baseRegPct, prRegPct)} |\n`;
              markdown += `\n`;
            }

            if (summaryText) {
              markdown += `<details>\n<summary><b>Detailed Coverage by Crate / Module</b></summary>\n\n\`\`\`\n${summaryText}\n\`\`\`\n</details>\n\n`;
            }

            markdown += `*Interactive HTML coverage report is downloadable from the workflow summary artifacts.*\n`;

            // Output to GitHub Actions Step Summary
            await core.summary.addRaw(markdown).write();

            // Post sticky comment on PR if event is pull_request
            if (context.eventName === 'pull_request') {
              try {
                const header = '<!-- cargo-llvm-cov-coverage-report -->';
                const commentBody = `${header}\n${markdown}`;

                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                });

                const existingComment = comments.find(c => c.body.includes(header));

                if (existingComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existingComment.id,
                    body: commentBody,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: commentBody,
                  });
                }
              } catch (err) {
                core.warning(`Failed to post PR comment: ${err.message}`);
              }
            }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html
          path: coverage-html

      - name: Upload LCOV report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov
          path: lcov.info

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features --exclude symphonia-play

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace --all-features --exclude symphonia-play
