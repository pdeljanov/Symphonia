[package]
name = "symphonia-codec-aac"
description = "Pure Rust AAC decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>", "Kostya Shishkov <kostya.shiskov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "aac", "m4a"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
std = ["symphonia-core/std", "symphonia-common/std", "num-traits/std"]

# Enable no_std support with `default-features = false`.
no_std = ["symphonia-core/no_std", "symphonia-common/no_std", "num-traits/libm"]

[dependencies]
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }
num-traits = { version = "0.2.19", default-features = false }
log = { workspace = true }

[dependencies.symphonia-common]
version = "0.6.1"
path = "../symphonia-common"
default-features = false

[dependencies.symphonia-core]
version = "0.6.1"
path = "../symphonia-core"
default-features = false

[lints]
workspace = true
