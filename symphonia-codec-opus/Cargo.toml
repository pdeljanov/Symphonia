[package]
name = "symphonia-codec-opus"
description = "Pure Opus decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "opus"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
std = ["symphonia-core/std"]

# Enable no_std support with `default-features = false`.
no_std = ["symphonia-core/no_std"]

[dependencies]
log = { workspace = true }
symphonia-core = { version = "0.6.1", path = "../symphonia-core", default-features = false }

[lints]
workspace = true
