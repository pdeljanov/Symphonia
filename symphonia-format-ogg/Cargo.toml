[package]
name = "symphonia-format-ogg"
description = "Pure Rust OGG demuxer (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "media", "demuxer", "ogg"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
std = ["symphonia-core/std", "symphonia-common/std", "symphonia-metadata/std", "num-traits/std"]

# Enable no_std support with `default-features = false`.
no_std = [
    "symphonia-core/no_std",
    "symphonia-common/no_std",
    "symphonia-metadata/no_std",
    "num-traits/libm",
]

[dependencies]
log = { workspace = true }
num-traits = { version = "0.2.19", default-features = false }

[dependencies.symphonia-core]
version = "0.6.1"
path = "../symphonia-core"
default-features = false

[dependencies.symphonia-common]
version = "0.6.1"
path = "../symphonia-common"
default-features = false

[dependencies.symphonia-metadata]
version = "0.6.1"
path = "../symphonia-metadata"
default-features = false
features = ["vorbis"]

[lints]
workspace = true
