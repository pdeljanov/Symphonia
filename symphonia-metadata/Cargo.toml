[package]
name = "symphonia-metadata"
description = "Project Symphonia multimedia tag and metadata readers."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["multimedia", "media", "metadata", "id3v1", "id3v2"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std", "ape", "id3v1", "id3v2"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
std = ["symphonia-core/std"]

# Enable no_std support with `default-features = false`.
no_std = ["symphonia-core/no_std"]

# Standalone metadata format readers.
ape = []
id3v1 = []
id3v2 = []

# Embedded metadata format readers.
flac = ["vorbis"]
riff-info = []
riff-id3 = ["id3v2"]
vorbis = ["flac"]

# Meta-feature to enable all embedded RIFF metadata format readers.
riff = [
    "riff-id3",
    "riff-info",
]

[dependencies]
log = { workspace = true }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }
regex = { version = "1", default-features = false, features = ["unicode"] }
smallvec = { workspace = true }

[dependencies.symphonia-core]
version = "0.6.1"
path = "../symphonia-core"
default-features = false

[lints]
workspace = true
