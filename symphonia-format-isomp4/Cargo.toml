[package]
name = "symphonia-format-isomp4"
description = "Pure Rust ISO/MP4 demuxer (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "media", "demuxer", "mp4", "iso"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
std = ["symphonia-core/std", "symphonia-common/std", "symphonia-metadata/std"]

# Enable no_std support with `default-features = false`.
no_std = ["symphonia-core/no_std", "symphonia-common/no_std", "symphonia-metadata/no_std"]

[dependencies]
log = { workspace = true }

[dependencies.symphonia-common]
version = "0.6.1"
path = "../symphonia-common"
default-features = false

[dependencies.symphonia-core]
version = "0.6.1"
path = "../symphonia-core"
default-features = false

[dependencies.symphonia-metadata]
version = "0.6.1"
path = "../symphonia-metadata"
default-features = false

[lints]
workspace = true
